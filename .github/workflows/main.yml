name: S4ntrx Timestamp Update

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-timestamp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > timestamp.txt

      - name: Configure Git
        run: |
          git config user.name "S4ntrx"
          git config user.email "spicezke@gmail.com"

      - name: Commit timestamp
        run: |
          git add timestamp.txt
          git diff --cached --quiet || git commit -m "Update timestamp"

      - name: Push changes
        run: |
          git push
